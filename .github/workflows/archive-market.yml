name: Archive daily market observations

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Archive market data
        run: python archive_market.py

      - name: Commit daily history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily market data"
            git push
          fi
