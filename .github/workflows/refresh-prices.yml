
name: Refresh MARLOWE WEALTH market prices

on:
  workflow_dispatch:
  schedule:
    # Every hour at minute 17 (UTC)
    # Taiwan time: 01:17, 02:17 ... 00:17
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-market-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Update market prices
        run: python update_market.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MARLOWE WEALTH market data"
            git push
          fi
